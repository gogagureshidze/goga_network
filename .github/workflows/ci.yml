name: Application checks (no deployment)
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local_test_only
          MYSQL_DATABASE: goga_validation
        ports: ['127.0.0.1:33367:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal_test_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:local_test_only@127.0.0.1:33367/goga_validation
      GOGA_TEST_DATABASE_URL: mysql://root:local_test_only@127.0.0.1:33367/goga_validation
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
      CLERK_SECRET_KEY: sk_test_local_build_only
      GOOGLE_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
      DEPLOYMENT_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install local audio test binaries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrate disposable CI database only
        run: npm run db:deploy
      # CI owns a disposable service container, not the Mac's dev:setup datadir.
      # Test entry points independently restrict the explicit URL to loopback.
      - run: node --test tests/mysql.integration.cjs
      - run: node --test tests/runtime.integration.cjs
      - run: node --test tests/fixtures.integration.cjs
      - run: node --test tests/media-api.integration.cjs
      - run: node --test tests/call-media.integration.cjs
      - run: node --test tests/inbox.integration.cjs
      - run: node --test tests/group-calls.integration.cjs
      - run: npm run build
      - run: node scripts/check-build-artifacts.js
      - name: Check production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high
  sfu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The SFU test imports pure JS policy/signing modules only.
      - run: npm ci --ignore-scripts
      - name: Real local SFU publication and room isolation
        shell: bash
        run: |
          set -euo pipefail
          GOGA_SFU_TOOLS="$(mktemp -d)"
          docker run --rm -d --name goga-livekit-validation --cpus=1 --memory=512m \
            -p 127.0.0.1:17880:17880 -p 127.0.0.1:17881:17881 -p 127.0.0.1:17882:17882/udp \
            --mount "type=bind,source=$PWD/ops/livekit.local-test.yaml,target=/etc/livekit-test.yaml,readonly" \
            livekit/livekit-server:v1.13.11 --config /etc/livekit-test.yaml
          trap 'docker stop goga-livekit-validation >/dev/null' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:17880/
          docker run --rm --network container:goga-livekit-validation --cpus=2 --memory=1g \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$GOGA_SFU_TOOLS,target=/tools" \
            -e GOGA_LOCAL_SFU_TEST=true -e GOGA_RTC_NODE_TEST_MODULE=/tools/node_modules/@livekit/rtc-node \
            -w /workspace node:24-bookworm-slim sh -c \
            'npm install --prefix /tools --no-audit --no-fund @livekit/rtc-node@1.2.2 && node --test tests/livekit-sfu.integration.cjs'
