<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C7CFF"/>
      <stop offset="100%" stop-color="#00E0FF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="300"
          stroke="url(#mainGradient)"
          stroke-width="20"
          fill="none"/>

  <circle cx="400" cy="400" r="210"
          stroke="url(#mainGradient)"
          stroke-width="10"
          stroke-dasharray="14 10"
          fill="none"
          opacity="0.85"/>

  <g stroke="url(#mainGradient)" stroke-width="16" stroke-linecap="round">
    <line x1="310" y1="400" x2="310" y2="450"/>
    <line x1="350" y1="370" x2="350" y2="470"/>
    <line x1="400" y1="330" x2="400" y2="490"/>
    <line x1="450" y1="370" x2="450" y2="470"/>
    <line x1="490" y1="400" x2="490" y2="450"/>
  </g>

  <circle cx="400" cy="400" r="52"
          fill="#0B1020"
          filter="url(#softGlow)"/>

  <g stroke="#00E0FF" stroke-width="2" opacity="0.9">
    <line x1="400" y1="348" x2="400" y2="320"/>
    <line x1="452" y1="400" x2="480" y2="400"/>
    <line x1="400" y1="452" x2="400" y2="480"/>
    <line x1="348" y1="400" x2="320" y2="400"/>
  </g>

  <g fill="#7C7CFF">
    <circle cx="400" cy="300" r="6"/>
    <circle cx="500" cy="400" r="6"/>
    <circle cx="400" cy="500" r="6"/>
    <circle cx="300" cy="400" r="6"/>
  </g>
</svg>
